version: 2.1

executors:
  gcp-machine:
    machine:
      image: ubuntu-2204:current
    working_directory: ~/repo

jobs:
  build_and_push:
    executor: gcp-machine
    steps:
      - checkout

      - run:
          name: Authenticate to Google Cloud (OIDC)
          command: |
            # Write CircleCI OIDC token to file
            echo "$CIRCLE_OIDC_TOKEN_V2" > /tmp/oidc-token

            # Create external account credential config (NO service account key)
            gcloud iam workload-identity-pools create-cred-config \
              "projects/383274227926/locations/global/workloadIdentityPools/circleci-pool/providers/circleci-provider" \
              --service-account="my-ci-sa@project-43fb5c97-55ce-44f7-b35.iam.gserviceaccount.com" \
              --credential-source-file="/tmp/oidc-token" \
              --output-file="/tmp/gcp-external.json"

            # Let ALL Google tools (including docker helper) use this identity
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-external.json

            # Configure Docker auth for Artifact Registry
            gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - run:
          name: Build and Push Docker Image
          command: |
            docker build \
              -t us-central1-docker.pkg.dev/project-43fb5c97-55ce-44f7-b35/llmops-repo/llmops-app:${CIRCLE_SHA1} .
            docker push \
              us-central1-docker.pkg.dev/project-43fb5c97-55ce-44f7-b35/llmops-repo/llmops-app:${CIRCLE_SHA1}

  deploy_to_gke:
    executor: gcp-machine
    steps:
      - checkout

      - run:
          name: Authenticate to Google Cloud (OIDC)
          command: |
            echo "$CIRCLE_OIDC_TOKEN_V2" > /tmp/oidc-token

            gcloud iam workload-identity-pools create-cred-config \
              "projects/383274227926/locations/global/workloadIdentityPools/circleci-pool/providers/circleci-provider" \
              --service-account="my-ci-sa@project-43fb5c97-55ce-44f7-b35.iam.gserviceaccount.com" \
              --credential-source-file="/tmp/oidc-token" \
              --output-file="/tmp/gcp-external.json"

            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-external.json

      - run:
          name: Configure GKE
          command: |
            gcloud container clusters get-credentials "$GKE_CLUSTER" \
              --region "$GOOGLE_COMPUTE_REGION" \
              --project "project-43fb5c97-55ce-44f7-b35"

      - run:
          name: Deploy to GKE
          command: |
            kubectl apply -f kubernetes-deployment.yaml
            kubectl rollout restart deployment llmops-app

workflows:
  version: 2
  deploy_pipeline:
    jobs:
      - build_and_push
      - deploy_to_gke:
          requires:
            - build_and_push
